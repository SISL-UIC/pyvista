name: Unit Testing and Deployment
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  ALLOW_PLOTTING: true
  SHELLOPTS: errexit:pipefail
  TOX_COLORED: 'yes'
  USE_CACHE: ${{ ( (github.event_name == 'workflow_dispatch' && github.event.inputs.cache
    == 'true') || (github.event_name == 'pull_request') || (github.event_name == 'push')
    ) && !startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/heads/release/')
    && !startsWith(github.ref, 'refs/heads/main') }}
  CACHE_FOLDER_NAME: pyvista-data
  PYVISTA_VTK_DATA: ${{ github.workspace }}/pyvista-data
  PYTHONPATH: /tmp/instr
  BASH_ENV: /tmp/instr/bash_env.sh
permissions:
  id-token: none
jobs:
  pr-info:
    name: Save PR info
    runs-on: self-hosted
    if: github.event_name == 'pull_request'
    steps:
    - name: Save PR metadata
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
      run: |
        mkdir -p pr-info
        printf '%s' "$PR_NUMBER" > pr-info/pr_number.txt
        printf '%s' "$HEAD_SHA" > pr-info/head_sha.txt
        printf '%s' "$IS_FORK" > pr-info/is_fork.txt
    - uses: actions/upload-artifact@v7
      with:
        name: pr-info
        path: pr-info/
    timeout-minutes: 15
  macOS:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: MacOS Unit Testing (3.10)
          python-version: '3.10'
          runner-labels: macos-15-self-hosted
        - name: MacOS Unit Testing (3.11)
          python-version: '3.11'
          runner-labels: macos-15-self-hosted
        - name: MacOS Unit Testing (3.12)
          python-version: '3.12'
          runner-labels: macos-15-self-hosted
        - name: MacOS Unit Testing (3.13)
          python-version: '3.13'
          runner-labels: macos-15-self-hosted
        - name: MacOS Unit Testing (3.14)
          python-version: '3.14'
          runner-labels: macos-15-self-hosted
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      if: runner.environment != 'self-hosted'
      uses: actions/setup-python@v6
      continue-on-error: true
      with:
        python-version: ${{ matrix.python-version }}
        cache: ${{ env.USE_CACHE == 'true' && 'pip' || '' }}
    - name: Set Python PATH and create a virtual env
      if: runner.environment == 'self-hosted'
      run: |
        /opt/homebrew/bin/python${{ matrix.python-version }} -m venv .venv
        echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
    - name: Restore pyvista/data cache
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ env.CACHE_FOLDER_NAME }}
        key: ${{ needs.cache-macOS-self-hosted.outputs.key }}
        enableCrossOsArchive: true
    - name: Install tox-uv
      run: pip install tox-uv
    - name: Core Testing (no GL)
      run: tox run -e py${{ matrix.python-version }}-core
    - name: Plotting Testing (uses GL)
      if: ${{ !cancelled() }}
      run: tox run -e py${{ matrix.python-version }}-plotting
    - name: Upload Images for Failed Tests
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: failed_test_images-${{ github.job }}-${{ join(matrix.* , '-') }}
        path: _failed_test_images
    - name: Upload Generated Images
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: generated_test_images-${{ github.job }}-${{ join(matrix.* , '-') }}
        path: _generated_test_images
    timeout-minutes: 15
    if: ${{ !cancelled() }}
  Linux:
    name: Linux Unit Testing (${{ matrix.python-version }}, ${{ matrix.vtk-version
      }}, ${{ matrix.numpy-version }})
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        include:
        - python-version: '3.10'
          vtk-version: 9.3.1
          numpy-version: latest
        - python-version: '3.11'
          vtk-version: 9.4.2
          numpy-version: latest
        - python-version: '3.12'
          vtk-version: 9.5.2
          numpy-version: latest
        - python-version: '3.13'
          vtk-version: latest
          numpy-version: latest
        - python-version: '3.14'
          vtk-version: latest
          numpy-version: nightly
    env:
      TOX_FACTOR: py${{matrix.python-version}}-numpy_${{matrix.numpy-version}}-vtk_${{matrix.vtk-version}}
      PARALLEL: -n auto
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 2
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9
      with:
        packages: xvfb libgl1 libglx-mesa0 libosmesa6
        version: 3.0
    - name: Restore pyvista/data cache
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ env.CACHE_FOLDER_NAME }}
        key: ${{ needs.cache-github-hosted.outputs.key }}
        enableCrossOsArchive: true
    - name: Install tox-uv
      run: pip install tox-uv
    - name: Core Testing (no GL)
      env:
        TOX_ENV: ${{ env.TOX_FACTOR }}-cov-core
      run: tox run -e "$TOX_ENV"
    - name: Plotting Testing (uses GL)
      if: ${{ !cancelled() }}
      env:
        TOX_ENV: ${{ env.TOX_FACTOR }}-cov-plotting
      run: xvfb-run tox run -e "$TOX_ENV"
    - name: Upload Images for Failed Tests
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: failed_test_images-${{ github.job }}-${{ join(matrix.* , '-') }}
        path: _failed_test_images
    - name: Upload Generated Images
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: generated_test_images-${{ github.job }}-${{ join(matrix.* , '-') }}
        path: _generated_test_images
    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage_reports-${{ github.job }}-${{ join(matrix.* , '-') }}
        path: coverage*.xml
        if-no-files-found: error
    - name: Check package
      run: |
        pip install build twine
        python -m build
        twine check --strict dist/*
    timeout-minutes: 15
    if: ${{ !cancelled() }}
  VTK-dev:
    if: |-
      ${{ !cancelled() && ((github.event_name != 'pull_request' && github.event_name != 'push' && github.event_name != 'merge_group') ||
      contains(github.event.pull_request.labels.*.name, 'vtk-dev-testing')) }}
    name: Linux VTK Dev Testing
    permissions:
      contents: read
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.14'
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 2
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - uses: awalsh128/cache-apt-pkgs-action@5513791f75b039e2a79653b1a92238d3fb8d99b4
      with:
        packages: xvfb libgl1 libglx-mesa0 libosmesa6
        version: 3.0
    - name: Restore pyvista/data cache
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ env.CACHE_FOLDER_NAME }}
        key: ${{ needs.cache-github-hosted.outputs.key }}
        enableCrossOsArchive: true
    - name: Install tox-uv
      run: pip install tox-uv
    - name: Core Testing (no GL)
      run: tox run -e py${{ matrix.python-version }}-cov-core-vtk_dev
    - name: Plotting Testing (uses GL)
      if: ${{ !cancelled() }}
      run: xvfb-run tox run -e py${{ matrix.python-version }}-cov-plotting-vtk_dev
    - name: Upload Images for Failed Tests
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: failed_test_images-${{ github.job }}-${{ join(matrix.* , '-') }}
        path: _failed_test_images
    - name: Upload Generated Images
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: generated_test_images-${{ github.job }}-${{ join(matrix.* , '-') }}
        path: _generated_test_images
    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage_reports-${{ github.job }}-${{ join(matrix.* , '-') }}
        path: coverage*.xml
        if-no-files-found: error
    timeout-minutes: 15
  upload-coverage-:
    name: Upload coverage reports
    runs-on: self-hosted
    needs:
    - Linux
    - VTK-dev
    if: ${{ !cancelled() && (!cancelled() && (!cancelled() && (always() && needs.Linux.result
      == 'success'))) }}
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 2
        persist-credentials: false
    - name: Download coverage reports
      uses: actions/download-artifact@v8
      with:
        pattern: coverage_reports-*
        path: coverage*.xml
    - name: Upload coverage to CodeCov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
      with:
        fail_ci_if_error: true
        use_oidc: true
    timeout-minutes: 15
  release:
    name: Release
    if: ${{ !cancelled() && (!cancelled() && (!cancelled() && (github.event_name ==
      'push' && contains(github.ref, 'refs/tags')))) }}
    needs:
    - Linux
    - macOS
    runs-on: self-hosted
    environment:
      name: pypi
      url: https://pypi.org/p/pyvista
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.14
    - name: Build package
      run: |
        pip install build
        python -m build
    - name: Upload to PyPi
      if: startsWith(github.ref, 'refs/tags/v')
      uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
    timeout-minutes: 15
'on':
  pull_request: null
  merge_group: null
  workflow_dispatch: null
  schedule:
  - cron: 0 4 * * *
  push:
    tags:
    - '*'
    branches:
    - main
